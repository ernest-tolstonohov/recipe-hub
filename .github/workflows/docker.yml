name: Docker

on:
  # push:
  #   branches: [master]
  # pull_request:
  #   branches: [master]
  workflow_dispatch:

jobs:
  docker-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create .env for CI
        run: |
          cat > .env <<EOF
          MYSQL_HOST=localhost
          MYSQL_USER=admin
          MYSQL_PASSWORD=password
          MYSQL_ROOT_PASSWORD=password
          MYSQL_DATABASE=recipehub-db
          MYSQL_ROOT_USER=root
          DB_CONTAINER=db
          DB_PORT=3306
          SESSION_SECRET=ci-test-secret
          EOF

      - name: Build and start services
        run: docker compose up -d --build --wait --wait-timeout 300

      - name: Verify response
        run: |
          STATUS=$(curl -o /dev/null -sw "%{http_code}" http://localhost:3000)
          echo "HTTP status: $STATUS"
          if [ "$STATUS" -lt 200 ] || [ "$STATUS" -ge 500 ]; then
            echo "Unexpected status code: $STATUS"
            docker compose logs
            exit 1
          fi

      - name: Show logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v
